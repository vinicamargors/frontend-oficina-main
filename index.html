<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1EDE4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214" />
    <script>
      (function () {
        var escuro;
        try {
          var t = localStorage.getItem('mecanify_tema');
          if (t === 'claro') escuro = false;
          else if (t === 'escuro') escuro = true;
        } catch (e) {}
        if (escuro === undefined) escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!escuro);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mecanify — Gestão de Oficina</title>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <a
      href="#conteudo-principal"
      class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-brand focus:text-on-brand focus:font-semibold focus:px-5 focus:py-3 focus:rounded-md"
    >
      Pular para o conteúdo principal
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
